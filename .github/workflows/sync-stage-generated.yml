name: Sync Stage 3/4 generated artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - stage-3-4-federal-state

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/stage-3-4-federal-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-3-4-federal-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed Stage 3/4 source files
        run: |
          printf '%s' '' | base64 --decode > /tmp/stage34.tgz
          tar -xzf /tmp/stage34.tgz
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - name: Commit generated artifacts and remove this one-use workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/discover-states.yml data index.html methodology pages schema scripts templates
          git rm .github/workflows/sync-stage-generated.yml
          git commit -m "Generate Stage 3 and 4 site artifacts"
          git push origin HEAD:stage-3-4-federal-state
